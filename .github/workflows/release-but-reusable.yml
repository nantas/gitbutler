name: Release but Reusable

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z or vX.Y.Z-rc.N)"
        required: true
        type: string
      prerelease_mode:
        description: "auto/true/false"
        required: false
        default: auto
        type: string
      target_commitish:
        description: "Target commit if tag does not exist yet"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      target_commitish: ${{ steps.prepare.outputs.target_commitish }}
      agent_prompt: ${{ steps.prepare.outputs.agent_prompt }}
    steps:
      - name: Validate and compute release metadata
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          MODE="${{ inputs.prerelease_mode }}"
          TARGET="${{ inputs.target_commitish }}"

          if [[ -z "${TAG}" ]]; then
            echo "tag is required" >&2
            exit 1
          fi

          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid tag '${TAG}', expected vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi

          if [[ "${MODE}" == "auto" ]]; then
            if [[ "${TAG}" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          elif [[ "${MODE}" == "true" || "${MODE}" == "false" ]]; then
            PRERELEASE="${MODE}"
          else
            echo "invalid prerelease_mode '${MODE}', expected auto/true/false" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          RAW_INSTALL_URL="https://raw.githubusercontent.com/${REPO}/${TAG}/scripts/install-github-release.sh"
          PROMPT="请在当前机器将 but 安装/更新到 ${TAG}：执行 \`curl -fsSL ${RAW_INSTALL_URL} | sh -s -- --repo ${REPO} --version ${TAG}\`，然后运行 \`but --version\` 并回报结果。"

          if [[ -z "${TARGET}" ]]; then
            TARGET="${GITHUB_SHA}"
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "target_commitish=${TARGET}"
            echo "agent_prompt=${PROMPT}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Build but
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --release \
            -p but \
            --features packaged-but-distribution \
            --target "${{ matrix.target }}"

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist out
          cp "target/${{ matrix.target }}/release/but" dist/but
          chmod +x dist/but
          dist/but --version

          ASSET_NAME="but-${TAG}-${{ matrix.platform }}.tar.gz"
          tar -C dist -czf "${ASSET_NAME}" but
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          fi

          mv "${ASSET_NAME}" out/
          mv "${ASSET_NAME}.sha256" out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: but-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET_COMMITISH: ${{ needs.prepare.outputs.target_commitish }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      AGENT_PROMPT: ${{ needs.prepare.outputs.agent_prompt }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifact directories
        shell: bash
        run: |
          set -euo pipefail
          find release -mindepth 2 -type f -exec mv {} release/ \;
          find release -mindepth 1 -type d -empty -delete
          ls -lah release

      - name: Generate checksums file
        shell: bash
        run: |
          set -euo pipefail
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "but-${TAG}-"*.tar.gz > "checksums-${TAG}.txt"
          else
            shasum -a 256 "but-${TAG}-"*.tar.gz > "checksums-${TAG}.txt"
          fi
          ls -lah

      - name: Generate release notes with agent prompt
        uses: actions/github-script@v7
        env:
          TAG: ${{ env.TAG }}
          TARGET_COMMITISH: ${{ env.TARGET_COMMITISH }}
          AGENT_PROMPT: ${{ env.AGENT_PROMPT }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.TAG;
            const target = process.env.TARGET_COMMITISH;
            const prompt = process.env.AGENT_PROMPT;

            const generated = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: target
            });

            const body = [
              "## Agent Install/Update Prompt",
              "",
              prompt,
              "",
              "## Changelog",
              "",
              generated.data.body || "_No changelog generated._"
            ].join("\n");

            fs.writeFileSync("release/release-notes.md", body, "utf8");

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.TARGET_COMMITISH }}
          name: but ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          body_path: release/release-notes.md
          files: |
            release/*.tar.gz
            release/checksums-*.txt
          fail_on_unmatched_files: true

  smoke-install:
    name: Smoke Test Install Command (${{ matrix.os }})
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Install from release command
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/scripts/install-github-release.sh" \
            | sh -s -- --repo "${GITHUB_REPOSITORY}" --version "${TAG}"

      - name: Verify installed version
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED="$("${HOME}/.local/bin/but" --version | awk '{print $2}')"
          EXPECTED="${TAG#v}"
          if [[ "${INSTALLED}" != "${EXPECTED}" ]]; then
            echo "Expected ${EXPECTED}, got ${INSTALLED}" >&2
            exit 1
          fi
